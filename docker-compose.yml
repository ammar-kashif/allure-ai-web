services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - frontend-data:/app/public/recordings
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLM_GPU=${LLM_GPU:-0}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads

volumes:
  frontend-data:
  backend-data:
  backend-uploads:

